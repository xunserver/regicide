[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "card-deck-pipeline"
version = "0.1.0"
description = "A resumable agent-and-script pipeline for visually consistent card decks"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.3,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
cardpipe = "cardpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
